id: open-notepad
name: 打开记事本
description: 启动 Windows 记事本应用。
version: "0.1.0"
author: tnt-team
license: MIT
tags: [productivity, text-editor]
inputs: []
permissions: [launch_app, wait_for_window]
on_error: STOP
on_block: STOP
steps:
  - kind: tool
    id: launch
    name: 启动 notepad.exe
    tool: launch_app
    args:
      executable: notepad.exe
      args: []
    timeout_s: 10
  - kind: complete
    id: done
    name: 完成
    message: 记事本已打开。
    depends_on: [launch]
