id: clipboard-format-text
name: 格式化剪贴板文本
description: 读取剪贴板内容，调用 LLM 整理后写回剪贴板。
version: "0.1.0"
author: tnt-team
license: MIT
tags: [productivity, clipboard, text]
inputs: []
permissions: [clipboard_read, llm_complete, clipboard_write]
steps:
  - kind: tool
    id: read
    name: 读取剪贴板
    tool: clipboard_read
    args: {}
  - kind: tool
    id: format
    name: 调用 LLM 整理文本
    tool: llm_complete
    args:
      system: "你是一个文本整理助手。规则：(1) 合并连续空格为一个空格；(2) 中英文标点统一为半角（除中文段落内的中文标点外）；(3) 删除复制粘贴产生的零宽字符、控制字符；(4) 修正明显错别字；(5) 不改变原意。只输出整理后的文本。"
      prompt: "请整理以下文本：\n\n{{read.text}}"
      max_tokens: 2000
      temperature: 0.1
    depends_on: [read]
  - kind: tool
    id: write
    name: 写回剪贴板
    tool: clipboard_write
    args:
      text: "{{format.text}}"
    depends_on: [format]
  - kind: complete
    id: done
    name: 完成
    message: 剪贴板文本已整理完成。可以直接粘贴了。
    depends_on: [write]
